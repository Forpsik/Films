<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#092018">
  <meta name="description" content="Личный киножурнал: поиск, оценки и список просмотра">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/films-option-1.svg">
  <link rel="apple-touch-icon" href="icons/films-option-1-512.png">
  <link rel="stylesheet" href="style.css">
  <title>Films</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="icons/films-option-1.svg" alt=""><span>Films</span></div>
    <div class="header-actions">
      <button class="icon-button" id="sync-button" title="Импорт и экспорт" aria-label="Синхронизация"><svg class="icon"><path d="M20 7h-5l2-2m-2 2 2 2M4 17h5l-2 2m2-2-2-2M5 7a7 7 0 0 1 12-1m2 11a7 7 0 0 1-12 1"/></svg><b>Синхронизация</b></button>
    </div>
  </header>
  <div class="sync-menu hidden" id="sync-menu">
    <button id="export-button">Сохранить файл синхронизации</button>
    <button id="import-button">Объединить с файлом</button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Разделы">
    <button data-tab="later" class="active"><svg class="icon"><path d="M6 4.8A1.8 1.8 0 0 1 7.8 3h8.4A1.8 1.8 0 0 1 18 4.8V21l-6-4-6 4z"/></svg><b>Позже</b></button>
    <button data-tab="watching"><svg class="icon"><path d="m9 6 10 6-10 6z"/></svg><b>Смотрю</b></button>
    <button data-tab="watched"><svg class="icon"><path d="m5 12 4 4L19 6"/></svg><b>Просмотрено</b></button>
    <button data-tab="catalog"><svg class="icon"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg><b>Каталог</b></button>
    <button data-tab="stats"><svg class="icon"><path d="M4 19V5m0 14h16M8 15v-4m4 4V7m4 8V9m4 6v-2"/></svg><b>Статистика</b></button>
  </nav>
  <main id="app" class="page"></main>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div id="modal-root"></div>
  <div class="toast hidden" id="toast"></div>
  <script src="app.js" defer></script>
</body>
</html>
